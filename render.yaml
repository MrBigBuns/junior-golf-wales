services:
  - type: web
    name: junior-golf-wales
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: junior-golf-wales-db
          property: connectionString

databases:
  - name: junior-golf-wales-db
    plan: free
