databases:
  - name: junior-golf-wales-db
    databaseName: junior_golf_wales
    user: jgw_app
    plan: basic-256mb
    region: oregon

services:
  - type: web
    name: junior-golf-wales
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm install
    preDeployCommand: npm run migrate
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: junior-golf-wales-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  # Weekly checks, Mondays 06:00 UTC (7am in summer, 6am in winter):
  # clubs' opens/junior pages for changes, then the BRS opens scan.
  # Results appear in admin under Page changes and Submissions.
  - type: cron
    name: junior-golf-wales-weekly-checks
    runtime: node
    region: oregon
    plan: starter
    schedule: "0 6 * * 1"
    buildCommand: npm install
    startCommand: node scripts/watch-club-pages.js; node scripts/scan-brs-opens.js --save
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: junior-golf-wales-db
          property: connectionString
      - key: NODE_ENV
        value: production
